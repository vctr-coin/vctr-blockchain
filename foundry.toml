[profile.default]
src = "contracts"
test = "test-foundry"
out = "out"
cache_path = "cache/foundry"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[invariant]
runs = 128
depth = 128
fail_on_revert = true
show_metrics = true
